[7:12 PM, 9/1/2026] Yusuf: <!DOCTYPE html>
<html>
<head>
    <title>Test Survey</title>
</head>
<body>

<h1>Test Survey</h1>

<form id="survey">
    <p>Question 1: What is your age?</p>
    <input type="radio" name="age" value="18-24"> 18-24<br>
    <input type="radio" name="age" value="25-34"> 25-34<br>
    <input type="radio" name="age" value="35-44"> 35-44<br>
    <input type="radio" name="age" value="45+"> 45+<br><br>

    <button type="button" onclick="submitSurvey()">Submit</button>
</form>

<div id="thankYou" style="display:none; color:green; font-size:24px;">
    ✅ Thank You! Your response has been received.
</div>

<script>
async function submitSurvey() {
    alert("1. Button clicked!");

    const form = document.getElementById("survey");
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
        data[key] = value;
    });

    alert("2. Data collected: " + JSON.stringify(data));

    const submitButton = document.querySelector("button");
    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";

    try {
        alert("3. About to send data...");

        
        const response = await fetch("https://script.google.com/macros/s/AKfycbxqGo5_CIxemkImac1SiMWuA6BE6RhyIUrQAv4IXTTILv1k7AufIuY3cUXmY29SN6Xm/exec", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams(data).toString()
        });

        alert("4. Response received!");
        console.log("Response:", response);

        document.getElementById("survey").style.display = "none";
        document.getElementById("thankYou").style.display = "block";

    } catch (error) {
        alert("5. Error: " + error.message);
        console.error("Error:", error);
    }

    submitButton.disabled = false;
    submitButton.textContent = "Submit";
}
</script>

</body>
</html>
